version: "3.8"
services:
  mongo:
    image: mongo
    container_name: mongoDb
    expose:
      - "27017"
    ports:
      - "27017:27017"
    networks:
      - bridgenetwork
    volumes:
      - mongovolume:/data/db
      - mongovolume:/data/confidb
    restart: always

  frontend:
    image: frontend
    container_name: frontend
    expose:
      - "8080"
    ports:
      - "5041:8080"
    build:
      context: .
      dockerfile: MangaFlex.FrontEnd.dockerfile
    depends_on:
      - mongo
    networks:
      - bridgenetwork
    restart: always

networks:
  bridgenetwork:

volumes:
  mongovolume:
